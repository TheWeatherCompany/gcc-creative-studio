<!--
  One box per media type, not one box re-fed. The box adjusts its resolution
  when it is given a model the resolution doesn't fit, and on a mode switch it
  still holds the other media type's resolution, which would overwrite the
  saved one.
-->
@if (isVideo) {
  <app-flow-prompt-box
    [prompt]="prompt"
    [mode]="mode"
    [modes]="modes"
    [generationModels]="models"
    [selectedGenerationModel]="model?.viewValue ?? ''"
    [aspectRatio]="aspectRatio"
    [aspectRatioOptions]="aspectRatioOptions"
    [outputs]="outputs"
    [maxOutputs]="maxOutputs"
    [resolution]="resolution"
    [duration]="duration"
    [isLoading]="isLoading"
    (promptChanged)="onPromptChanged($event)"
    (modeChanged)="onModeChanged($event)"
    (modelSelected)="onModelSelected($event)"
    (aspectRatioChanged)="onAspectRatioChanged($event)"
    (outputsChanged)="onOutputsChanged($event)"
    (resolutionChanged)="onResolutionChanged($event)"
    (durationChanged)="onDurationChanged($event)"
    (rewriteClicked)="rewritePrompt()"
    (generateClicked)="generate()"
  ></app-flow-prompt-box>
} @else {
  <app-flow-prompt-box
    [prompt]="prompt"
    [mode]="mode"
    [modes]="modes"
    [generationModels]="models"
    [selectedGenerationModel]="model?.viewValue ?? ''"
    [aspectRatio]="aspectRatio"
    [aspectRatioOptions]="aspectRatioOptions"
    [outputs]="outputs"
    [maxOutputs]="maxOutputs"
    [resolution]="resolution"
    [temperature]="temperature"
    [referenceImages]="mode === 'Ingredients to Image' ? references : []"
    [isLoading]="isLoading"
    (promptChanged)="onPromptChanged($event)"
    (modeChanged)="onModeChanged($event)"
    (modelSelected)="onModelSelected($event)"
    (aspectRatioChanged)="onAspectRatioChanged($event)"
    (outputsChanged)="onOutputsChanged($event)"
    (resolutionChanged)="onResolutionChanged($event)"
    (temperatureChanged)="onTemperatureChanged($event)"
    (openImageSelectorForReference)="openReferencePicker()"
    (clearReferenceImage)="clearReference($event.index)"
    (rewriteClicked)="rewritePrompt()"
    (generateClicked)="generate()"
  ></app-flow-prompt-box>
}
