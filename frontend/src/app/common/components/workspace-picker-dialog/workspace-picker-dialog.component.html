<div class="picker">
  <div class="picker-header">
    <div>
      <h2 class="picker-title">Workspaces</h2>
      <p class="picker-subtitle">Newest first. Pick one to switch to it.</p>
    </div>
    <button
      type="button"
      class="close-button"
      aria-label="Close"
      (click)="dialogRef.close()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (showFilter) {
    <div class="filter-box">
      <mat-icon class="filter-icon">search</mat-icon>
      <input
        type="text"
        class="filter-input"
        placeholder="Filter by name"
        aria-label="Filter workspaces by name"
        [(ngModel)]="filterText"
        cdkFocusInitial
      />
    </div>
  }

  <div class="card-grid">
    <button type="button" class="workspace-card create-card" (click)="create()">
      <div class="tile create-tile">
        <mat-icon>add</mat-icon>
      </div>
      <div class="card-body">
        <span class="card-name">Create workspace</span>
        <span class="card-meta">New private workspace</span>
      </div>
    </button>

    @for (workspace of visible; track workspace.id) {
      <button
        type="button"
        class="workspace-card"
        [class.active]="isActive(workspace)"
        [attr.aria-current]="isActive(workspace) ? 'true' : null"
        [attr.data-workspace-id]="workspace.id"
        (click)="select(workspace)"
      >
        <div class="tile" [style.background]="tileBackground(workspace)">
          <span class="tile-initials">{{ initials(workspace) }}</span>
          <mat-icon
            class="scope-badge"
            [matTooltip]="
              workspace.scope === WorkspaceScope.PUBLIC
                ? 'Public: everyone can see it'
                : 'Private: members only'
            "
            >{{
              workspace.scope === WorkspaceScope.PUBLIC ? 'public' : 'lock'
            }}</mat-icon
          >
          @if (isActive(workspace)) {
            <span class="current-badge">
              <mat-icon>check</mat-icon>Current
            </span>
          }
        </div>
        <div class="card-body">
          <span class="card-name" [title]="workspace.name">{{
            workspace.name
          }}</span>
          <span class="card-meta">
            @if (workspace.createdAt) {
              Created {{ workspace.createdAt | date: 'mediumDate' }}
            } @else {
              {{
                workspace.scope === WorkspaceScope.PUBLIC ? 'Public' : 'Private'
              }}
            }
          </span>
        </div>
      </button>
    }
  </div>

  @if (visible.length === 0) {
    <p class="no-results">No workspaces match "{{ filterText }}"</p>
  }
</div>
