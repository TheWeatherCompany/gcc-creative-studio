<nav class="view-toggle" aria-label="Gallery view">
  <a
    class="view-toggle__segment"
    [routerLink]="active === 'grid' ? null : '/gallery'"
    [class.view-toggle__segment--active]="active === 'grid'"
    [attr.aria-current]="active === 'grid' ? 'page' : null"
    title="View the gallery as a grid"
    data-testid="view-toggle-grid"
  >
    <mat-icon aria-hidden="true">grid_view</mat-icon>
    <span>Grid</span>
  </a>
  <a
    class="view-toggle__segment"
    [routerLink]="active === 'feed' ? null : '/gallery/feed'"
    [class.view-toggle__segment--active]="active === 'feed'"
    [attr.aria-current]="active === 'feed' ? 'page' : null"
    title="View generations as a feed, with prompts"
    data-testid="view-toggle-feed"
  >
    <mat-icon aria-hidden="true">view_agenda</mat-icon>
    <span>Feed</span>
    @if (showNewBadge) {
      <span class="view-toggle__badge" data-testid="view-toggle-new-badge"
        >New</span
      >
    }
  </a>
</nav>
