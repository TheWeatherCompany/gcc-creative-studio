name: License Check

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop
      - test
  push:
    branches: [main, develop, test]

permissions:
  contents: read

jobs:
  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.21"

      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.2.0

      - name: Run addlicense check
        run: |
          addlicense -check -c "Google LLC" -l apache $(find . -type f \( -name "*.py" -o -name "*.ts" -o -name "*.scss" -o -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.sh" \) -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/.git/*")
